# ============================================================
# .cnb.yml - CNB（cnb.cool）云原生构建配置
# Docker 制品库：docker.cnb.cool/jackch3n/cloudflare-doh
#   - 分支 push → :latest 与 :<分支名> 镜像
#   - tag  push → :<tag>、:<去 v 的版本号> 与 :latest 镜像
# 说明：`$` 兜底所有未明确声明的分支；services: docker 已内置对
#       docker.cnb.cool 的登录（CNB_TOKEN 自动注入），无需手动 docker login
# ============================================================

"$":
  # 分支推送：构建 edge 镜像
  push:
    - name: docker-edge
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: build & push (branch)
          script: |
            set -e
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            BRANCH_TAG="$(echo "${CNB_BRANCH}" | tr '/' '-')"
            docker build -t "${IMAGE}:latest" -t "${IMAGE}:${BRANCH_TAG}" .
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:${BRANCH_TAG}"
            echo "pushed: ${IMAGE}:latest ${IMAGE}:${BRANCH_TAG}"

  # tag 推送：构建版本化镜像（v1.4.1 → :v1.4.1 :1.4.1 :latest）
  tag_push:
    - name: docker-release
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: build & push (tag)
          script: |
            set -e
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VER="${CNB_BRANCH#v}"
            docker build -t "${IMAGE}:${CNB_BRANCH}" -t "${IMAGE}:${VER}" -t "${IMAGE}:latest" .
            docker push "${IMAGE}:${CNB_BRANCH}"
            docker push "${IMAGE}:${VER}"
            docker push "${IMAGE}:latest"
            echo "pushed: ${IMAGE}:${CNB_BRANCH} ${IMAGE}:${VER} ${IMAGE}:latest"
